<!DOCTYPE html>
<html>
<body>
<pre id="output"></pre>

<script>
fetch("facts.json")
  .then(r => r.json())
  .then(facts => {
      document.getElementById("output").innerText =
          JSON.stringify({
              fact: facts[Math.floor(Math.random() * facts.length)]
          }, null, 2);
  });
</script>

</body>
</html>
